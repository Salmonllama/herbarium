services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-herbarium}
      POSTGRES_USER: ${DB_USERNAME:-herbarium}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-herbarium}
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      - herbarium_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-herbarium} -d ${DB_DATABASE:-herbarium}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    profiles: ["search"]
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-herbarium-dev-master-key}
      MEILI_ENV: development
    ports:
      - "${DEV_MEILI_PORT:-7700}:7700"
    volumes:
      - herbarium_dev_meili:/meili_data

volumes:
  herbarium_dev_pgdata:
  herbarium_dev_meili:
